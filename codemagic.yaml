workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Install Gradle 8.9
        script: |
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /tmp
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build debug APK
        script: /tmp/gradle-8.9/bin/gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
